<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;color:#eff8ff;background:radial-gradient(ellipse at 50% 40%,#18294b,#0b1223 52%,#050812);font-family:system-ui,Arial,sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:min(96vw,1000px);aspect-ratio:1000/620}canvas{display:block;width:100%;height:100%;border:1px solid #a6d3ff52;border-radius:20px;background:#080e1a;box-shadow:0 30px 100px #000b,0 0 42px #59caff1c}#menu{position:absolute;inset:0;display:grid;place-items:center;border-radius:20px;background:#060b16a8;backdrop-filter:blur(5px);transition:.25s}#menu.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(90%,590px);padding:clamp(18px,4vw,36px);border:1px solid #c0e8ff35;border-radius:24px;text-align:center;background:linear-gradient(145deg,#111e35f2,#09101ff2);box-shadow:0 24px 80px #0009}.eyebrow{color:#77e7ff;font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}h1{margin:10px 0 4px;font-size:clamp(27px,5vw,48px);line-height:1;letter-spacing:.08em}h1 span{color:#70e7ff}.card p{margin:12px 0 22px;color:#c1d3eb;font-size:14px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mode{min-height:78px;padding:12px 6px;border:1px solid #9de7ff48;border-radius:14px;color:#f5fbff;background:linear-gradient(160deg,#1a3551,#111a2d);cursor:pointer;transition:.15s}.mode:hover{transform:translateY(-3px);border-color:#7eeaff;filter:brightness(1.2)}.mode b,.mode small{display:block}.mode small{margin-top:7px;color:#a9bfd9;font-size:10px}.hint{margin-top:16px;color:#859bb9;font-size:10px}#banner{position:absolute;top:15%;left:50%;transform:translate(-50%,-10px) scale(.9);padding:11px 22px;border:1px solid #b1f1ff88;border-radius:999px;background:#071323e8;box-shadow:0 0 30px #4bdcff55;font-weight:950;letter-spacing:.12em;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}#banner.show{opacity:1;transform:translate(-50%,0) scale(1)}@media(max-width:560px){#stage{width:98vw}.modes{gap:5px}.mode{min-height:67px}.mode small{font-size:9px}}

<body><main id="stage"><canvas id="game" width="1000" height="620"></canvas><section id="menu"><div class="card"><div class="eyebrow">A chaotic arena brawler</div><h1>ORBITAL <span>BRAWL</span></h1><p>Choose a mode. The fighters handle the rest.</p><div class="modes"><button class="mode" data-mode="1v1"><b>1 vs 1</b><small>Head-to-head</small></button><button class="mode" data-mode="2v2"><b>2 vs 2</b><small>Team battle</small></button><button class="mode" data-mode="ffa3"><b>3 BALL FFA</b><small>Every orb for itself</small></button><button class="mode" data-mode="ffa4"><b>4 BALL FFA</b><small>Full arena chaos</small></button></div><div class="hint">12 fighters · unique weapons · automatic abilities</div></div></section><div id="banner"></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),menu=document.querySelector('#menu'),banner=document.querySelector('#banner'),W=1000,H=620,A={l:105,r:895,t:82,b:550};
const roster=[
{name:'COMET',color:'#32e5d0',light:'#c2fff5',shape:'star',weapon:'spear',ability:'dash'},
{name:'FROST',color:'#5faaff',light:'#d8efff',shape:'crystal',weapon:'iceaxe',ability:'freeze'},
{name:'BLAZE',color:'#ff713e',light:'#ffe083',shape:'flame',weapon:'sword',ability:'pulse'},
{name:'THORN',color:'#a2e954',light:'#e5ff9f',shape:'flower',weapon:'scythe',ability:'shield'},
{name:'VOLT',color:'#ffe34a',light:'#fff8bf',shape:'gear',weapon:'mace',ability:'heal'},
{name:'SHADE',color:'#b873ff',light:'#f0d7ff',shape:'eye',weapon:'claws',ability:'blink'},
{name:'ORBIT',color:'#ff65b5',light:'#ffd6ec',shape:'ring',weapon:'chakram',ability:'gravity'},
{name:'TITAN',color:'#ff5267',light:'#ffd0a6',shape:'hex',weapon:'hammer',ability:'meteor'},
{name:'HEX',color:'#9b83ff',light:'#d8d0ff',shape:'rune',weapon:'wand',ability:'summon',summoner:true},
{name:'VENOM',color:'#7af06b',light:'#dcffc6',shape:'fang',weapon:'twinblades',ability:'poison'},
{name:'RIPTIDE',color:'#31d6ff',light:'#d2f8ff',shape:'wave',weapon:'trident',ability:'surge'},
{name:'EMBER',color:'#ffb23f',light:'#fff0bd',shape:'sun',weapon:'flail',ability:'flare'}];
const labels={dash:'COMET DASH',freeze:'DEEP FREEZE',pulse:'SOLAR BURST',shield:'BRAMBLE GUARD',heal:'RECHARGE',blink:'SHADOW STEP',gravity:'GRAVITY WELL',meteor:'METEOR SMASH',summon:'SUMMON WISPS',poison:'VENOM STRIKE',surge:'TIDAL SURGE',flare:'FLARE UP'};
const S={mode:'',playing:false,balls:[],wisps:[],fx:[],bits:[],shake:0,last:0};
const rand=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ball(f,team,x,y,angle){let sp=rand(235,315);return{...f,team,x,y,vx:Math.cos(angle)*sp,vy:Math.sin(angle)*sp,r:22,hp:100,angle:rand(0,6.28),spin:rand(3.8,5.5)*(Math.random()<.5?-1:1),abilityCd:rand(1.2,2.7),hitCd:0,shield:0,freeze:0,poison:0,poisonCd:0,flash:0,trail:[],out:false}}
function positionsFor(mode,count){
  if(mode==='1v1') return [{x:A.l+160,y:316,t:0},{x:A.r-160,y:316,t:1}];
  if(mode==='2v2') return [{x:220,y:190,t:0},{x:780,y:190,t:1},{x:220,y:440,t:1},{x:780,y:440,t:0}];
  let cx=W/2,cy=(A.t+A.b)/2,r=count===3?205:245;return Array.from({length:count},(_,i)=>{let a=-Math.PI/2+i*6.283/count; return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,t:i}});
}
function start(mode){S.mode=mode;let n=mode==='1v1'?2:mode==='2v2'?4:mode==='ffa3'?3:4,selected=shuffle(roster).slice(0,n),spots=positionsFor(mode,n);S.balls=selected.map((f,i)=>{let p=spots[i],q=spots[(i+1)%n];return ball(f,p.t,p.x,p.y,Math.atan2(q.y-p.y,q.x-p.x))});if(!S.balls.some(x=>x.summoner)&&Math.random()<.4){let i=Math.floor(Math.random()*n),p=S.balls[i];S.balls[i]=ball(roster[8],p.team,p.x,p.y,rand(0,6.28))}S.wisps=[];S.fx=[];S.bits=[];S.shake=0;S.playing=true;menu.classList.add('hidden');banner.textContent=mode==='1v1'?'1 VS 1 · HEAD TO HEAD':mode==='2v2'?'2 VS 2 · TEAM BATTLE':n+' BALL FREE-FOR-ALL';banner.classList.add('show');setTimeout(()=>banner.classList.remove('show'),1050)}
function enemies(b){return S.balls.filter(x=>!x.out&&x.team!==b.team)}function target(b){let best=null,d0=Infinity;for(let e of enemies(b)){let d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<d0){d0=d;best=e}}return best}
function ring(x,y,c,size=90,life=.5){S.fx.push({x,y,c,size,life,max:life})}function burst(x,y,c,n=12,power=140){for(let i=0;i<n;i++){let a=rand(0,6.283),v=rand(power*.25,power);S.bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:rand(.25,.65),max:.65,r:rand(2,5)}}}
function finish(w){if(!S.playing)return;S.playing=false;banner.textContent=w?w.name+' WINS!':'DRAW!';banner.classList.add('show');setTimeout(()=>{banner.classList.remove('show');menu.classList.remove('hidden')},1200)}
function hit(e,n,by){if(!S.playing||e.out)return;if(e.shield>0)n*=.3;e.hp=clamp(e.hp-n,0,100);e.flash=.22;burst(e.x,e.y,e.light,9,115);ring(e.x,e.y,e.color,35,.2);S.shake=Math.max(S.shake,3.8);if(e.hp<=0){e.out=true;burst(e.x,e.y,e.color,32,250);ring(e.x,e.y,'#fff',140,.55);let teams=new Set(S.balls.filter(b=>!b.out).map(b=>b.team));if(teams.size<=1)finish(S.balls.find(b=>!b.out))}}
function special(b){let e=target(b);if(!e)return;let dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;switch(b.ability){case'dash':b.vx+=nx*280;b.vy+=ny*280;ring(b.x,b.y,b.color,100);burst(b.x,b.y,b.color,18,180);break;case'freeze':if(d<320){e.freeze=1.1;ring(e.x,e.y,'#b9efff',125);burst(e.x,e.y,'#d7f6ff',18,115)}break;case'pulse':if(d<260){hit(e,15,b);e.vx+=nx*180;e.vy+=ny*180}ring(b.x,b.y,'#ffcc6d',190);burst(b.x,b.y,b.light,23,200);break;case'shield':b.shield=2.7;ring(b.x,b.y,b.light,82);burst(b.x,b.y,b.color,15,120);break;case'heal':b.hp=clamp(b.hp+16,0,100);ring(b.x,b.y,'#fff08a',100);burst(b.x,b.y,'#fff08a',18,120);break;case'blink':{let ox=b.x,oy=b.y;b.x=clamp(e.x-nx*95,A.l+40,A.r-40);b.y=clamp(e.y-ny*95,A.t+40,A.b-40);ring(ox,oy,b.color,85);ring(b.x,b.y,b.light,85);burst(ox,oy,b.color,14,130);burst(b.x,b.y,b.color,14,130);break}case'gravity':if(d<420){e.vx-=nx*240;e.vy-=ny*240;ring(e.x,e.y,b.color,100)}ring(b.x,b.y,b.color,150);break;case'meteor':if(d<300){hit(e,19,b);e.vx+=nx*235;e.vy+=ny*235}ring(b.x,b.y,'#ffb56b',210);burst(b.x,b.y,b.light,26,220);break;case'summon':{let owned=S.wisps.filter(w=>w.owner===b).length;for(let i=owned;i<3;i++){let a=rand(0,6.283);S.wisps.push({owner:b,x:b.x+Math.cos(a)*28,y:b.y+Math.sin(a)*28,vx:0,vy:0,r:8,life:7,cd:.3,c:b.light})}ring(b.x,b.y,b.color,140);burst(b.x,b.y,b.light,23,155);break}case'poison':if(d<260){e.poison=3;e.poisonCd=0;hit(e,5,b);burst(e.x,e.y,'#83ff68',18,110)}ring(b.x,b.y,'#8dff65',110);break;case'surge':b.vx+=nx*210;b.vy+=ny*210;if(d<230){hit(e,10,b);e.vx+=nx*140;e.vy+=ny*140}ring(b.x,b.y,'#7eeeff',180);burst(b.x,b.y,'#60ddff',21,180);break;case'flare':if(d<220)hit(e,12,b);b.vx-=nx*100;b.vy-=ny*100;ring(b.x,b.y,'#ffe08a',170);burst(b.x,b.y,'#ff8b38',24,200);break}}
function update(dt){if(!S.playing)return;for(let b of S.balls){if(b.out)continue;b.abilityCd-=dt;b.hitCd=Math.max(0,b.hitCd-dt);b.shield=Math.max(0,b.shield-dt);b.freeze=Math.max(0,b.freeze-dt);b.flash=Math.max(0,b.flash-dt);b.poison=Math.max(0,b.poison-dt);b.poisonCd-=dt;if(b.poison>0&&b.poisonCd<=0){b.poisonCd=.85;hit(b,2);burst(b.x,b.y,'#8dff65',3,45)}if(!S.playing)return;if(b.abilityCd<=0){special(b);b.abilityCd=b.summoner?5.3:rand(4.5,6.2)}b.angle+=b.spin*dt;let slow=b.freeze>0?.25:1;b.x+=b.vx*slow*dt;b.y+=b.vy*slow*dt;let p=b.r+12;if(b.x<A.l+p){b.x=A.l+p;b.vx=Math.abs(b.vx)*1.04;burst(b.x,b.y,b.color,3,45)}else if(b.x>A.r-p){b.x=A.r-p;b.vx=-Math.abs(b.vx)*1.04;burst(b.x,b.y,b.color,3,45)}if(b.y<A.t+p){b.y=A.t+p;b.vy=Math.abs(b.vy)*1.04;burst(b.x,b.y,b.color,3,45)}else if(b.y>A.b-p){b.y=A.b-p;b.vy=-Math.abs(b.vy)*1.04;burst(b.x,b.y,b.color,3,45)}let s=Math.hypot(b.vx,b.vy);if(s>410){b.vx*=410/s;b.vy*=410/s}else if(s<190){let a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*190;b.vy=Math.sin(a)*190}b.trail.push({x:b.x,y:b.y,l:.32});b.trail.forEach(t=>t.l-=dt);b.trail=b.trail.filter(t=>t.l>0)}if(!S.playing)return;
for(let w of S.wisps){w.life-=dt;let e=target(w.owner);if(!e){w.life=0;continue}let dx=e.x-w.x,dy=e.y-w.y,d=Math.hypot(dx,dy)||1;w.vx+=dx/d*650*dt;w.vy+=dy/d*650*dt;let s=Math.hypot(w.vx,w.vy);if(s>255){w.vx*=255/s;w.vy*=255/s}w.x+=w.vx*dt;w.y+=w.vy*dt;w.cd-=dt;if(d<e.r+12&&w.cd<=0){hit(e,5,w.owner);w.cd=.7;burst(w.x,w.y,w.c,6,80)}}S.wisps=S.wisps.filter(w=>w.life>0&&!w.owner.out);
let alive=S.balls.filter(b=>!b.out);for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){let a=alive[i],b=alive[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=a.r+b.r;if(d<m){let nx=dx/d,ny=dy/d,o=m-d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){let im=-rel*.72;a.vx-=im*nx;a.vy-=im*ny;b.vx+=im*nx;b.vy+=im*ny}}}
for(let b of alive){if(b.out||b.hitCd>0)continue;let e=target(b);if(!e)continue;let dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx),dif=Math.atan2(Math.sin(a-b.angle),Math.cos(a-b.angle));if(d<126&&Math.abs(dif)<.48){let damageBy={spear:13,iceaxe:15,sword:16,scythe:12,mace:14,claws:11,chakram:12,hammer:17,wand:10,twinblades:12,trident:14,flail:15};hit(e,damageBy[b.weapon]||12,b);b.hitCd=.5;e.vx+=dx/d*145;e.vy+=dy/d*145;ring(e.x,e.y,b.light,55,.25)}}}
function polygon(p,fill,stroke='#fff',lw=2){ctx.beginPath();p.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function star(ro,ri,n=5){let p=[];for(let i=0;i<n*2;i++){let r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/n;p.push([Math.cos(a)*r,Math.sin(a)*r])}return p}
function core(b,r=b.r){ctx.save();ctx.translate(b.x,b.y);ctx.shadowColor=b.color;ctx.shadowBlur=22;ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fillStyle=b.color;ctx.fill();ctx.shadowBlur=0;switch(b.shape){case'star':polygon(star(r*.88,r*.5),b.light,null);break;case'crystal':polygon([[0,-r*.9],[r*.65,-r*.25],[r*.45,r*.65],[0,r*.9],[-r*.45,r*.65],[-r*.65,-r*.25]],b.light,null);break;case'flame':polygon([[0,-r],[r*.6,-r*.2],[r*.7,r*.4],[0,r*.85],[-r*.65,r*.4],[-r*.45,-r*.3]],b.light,null);break;case'flower':for(let i=0;i<6;i++){let a=i*1.047;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.35,Math.sin(a)*r*.35,r*.34,r*.19,a,0,6.283);ctx.fillStyle=b.light;ctx.fill()}ctx.beginPath();ctx.arc(0,0,r*.2,0,6.283);ctx.fillStyle='#568631';ctx.fill();break;case'gear':polygon(star(r*.9,r*.68,8),b.light,null);ctx.beginPath();ctx.arc(0,0,r*.32,0,6.283);ctx.fillStyle='#c79517';ctx.fill();break;case'eye':ctx.beginPath();ctx.ellipse(0,0,r*.88,r*.52,0,0,6.283);ctx.fillStyle=b.light;ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.29,0,6.283);ctx.fillStyle='#602d99';ctx.fill();ctx.beginPath();ctx.arc(0,0,r*.1,0,6.283);ctx.fillStyle='#fff';ctx.fill();break;case'ring':ctx.beginPath();ctx.arc(0,0,r*.65,0,6.283);ctx.strokeStyle=b.light;ctx.lineWidth=r*.25;ctx.stroke();break;case'rune':polygon(star(r*.85,r*.55,4),b.light,null);ctx.strokeStyle='#7861d9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*.38,0,6.283);ctx.stroke();break;case'fang':ctx.beginPath();ctx.ellipse(0,0,r*.8,r*.62,0,0,6.283);ctx.fillStyle=b.light;ctx.fill();polygon([[-r*.4,-r*.1],[-r*.2,r*.4],[0,-r*.1]],'#317b39',null);polygon([[r*.4,-r*.1],[r*.2,r*.4],[0,-r*.1]],'#317b39',null);break;case'wave':ctx.strokeStyle=b.light;ctx.lineWidth=5;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*8,0,r*.42,.4,2.7);ctx.stroke()}break;case'sun':ctx.strokeStyle=b.light;ctx.lineWidth=3;for(let i=0;i<8;i++){let a=i*.785;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);ctx.lineTo(Math.cos(a)*r*.72,Math.sin(a)*r*.72);ctx.stroke()}ctx.beginPath();ctx.arc(0,0,r*.35,0,6.283);ctx.fillStyle=b.light;ctx.fill();break;default:polygon([[0,-r*.85],[r*.7,-r*.35],[r*.7,r*.35],[0,r*.85],[-r*.7,r*.35],[-r*.7,-r*.35]],b.light,null)}ctx.beginPath();ctx.ellipse(-r*.27,-r*.34,r*.2,r*.09,-.6,0,6.283);ctx.fillStyle='#ffffff80';ctx.fill();ctx.restore()}
function weapon(b){let orbit=b.r+30,x=b.x+Math.cos(b.angle)*orbit,y=b.y+Math.sin(b.angle)*orbit,c=b.light;ctx.save();ctx.translate(x,y);ctx.rotate(b.angle+Math.PI/2);ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,b.r+6);ctx.lineTo(0,4);ctx.stroke();ctx.shadowColor=c;ctx.shadowBlur=8;switch(b.weapon){case'spear':ctx.fillStyle='#9b693e';ctx.fillRect(-3,-4,6,30);polygon([[-4,-3],[0,-31],[4,-3]],c,'#fff',2);ctx.fillStyle='#fff';ctx.fillRect(-7,-6,14,3);break;case'iceaxe':ctx.fillStyle='#789bb8';ctx.fillRect(-3,-5,6,31);polygon([[-3,-8],[-18,-23],[-25,-8],[-14,2],[-3,0]],c,'#fff',2);polygon([[3,-8],[16,-20],[22,-7],[12,2],[3,0]],'#8ce9ff','#fff',2);break;case'sword':polygon([[-6,5],[-8,-10],[-4,-27],[0,-39],[4,-27],[8,-10],[6,5]],c,'#fff',2);ctx.fillStyle='#734429';ctx.fillRect(-9,2,18,5);ctx.fillRect(-3,7,6,13);break;case'scythe':ctx.strokeStyle='#547b34';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(0,-25);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-19);ctx.quadraticCurveTo(25,-39,26,-10);ctx.quadraticCurveTo(12,-21,2,-9);ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();break;case'mace':ctx.strokeStyle='#78633b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(0,-15);ctx.stroke();ctx.beginPath();ctx.arc(0,-21,11,0,6.283);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<6;i++){let a=i*1.047;ctx.beginPath();ctx.arc(Math.cos(a)*10,-21+Math.sin(a)*10,2,0,6.283);ctx.fillStyle='#fff';ctx.fill()}break;case'claws':for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*7,10);ctx.quadraticCurveTo(i*13,-7,i*9,-29);ctx.strokeStyle=c;ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}break;case'chakram':ctx.beginPath();ctx.arc(0,-14,13,0,6.283);ctx.strokeStyle=c;ctx.lineWidth=5;ctx.stroke();for(let i=0;i<8;i++){let a=i*.785;ctx.beginPath();ctx.moveTo(Math.cos(a)*12,-14+Math.sin(a)*12);ctx.lineTo(Math.cos(a)*20,-14+Math.sin(a)*20);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}break;case'hammer':ctx.fillStyle='#684b3c';ctx.fillRect(-4,-7,8,35);ctx.fillStyle='#da4058';ctx.fillRect(-14,-8,28,10);polygon([[-14,-8],[-17,-23],[-7,-18],[-3,-31],[2,-19],[9,-30],[11,-17],[17,-23],[14,-8]],c,'#fff',2);break;case'wand':ctx.strokeStyle='#d7caff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(0,-22);ctx.stroke();polygon(star(10,4,4),c,'#fff',2);break;case'twinblades':for(let s of[-1,1])polygon([[s*3,8],[s*17,-9],[s*16,-28],[s*8,-18],[s*1,-2]],c,'#fff',2);break;case'trident':ctx.strokeStyle='#a9efff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(0,-24);ctx.stroke();ctx.strokeStyle=c;ctx.lineWidth=4;for(let s of[-1,0,1]){ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(s*11,-30+Math.abs(s)*8);ctx.stroke()}break;case'flail':ctx.strokeStyle='#d9c9a7';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,12);ctx.lineTo(0,-17);ctx.stroke();ctx.beginPath();ctx.arc(0,-25,10,0,6.283);ctx.fillStyle=c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();for(let i=0;i<6;i++){let a=i*1.047;ctx.beginPath();ctx.arc(Math.cos(a)*10,-25+Math.sin(a)*10,2.5,0,6.283);ctx.fillStyle='#fff';ctx.fill()}break}ctx.restore()}
function drawBall(b,preview=false){if(b.out)return;for(let p of b.trail||[]){ctx.globalAlpha=Math.max(0,p.l/.32)*.27;ctx.beginPath();ctx.arc(p.x,p.y,b.r*.72,0,6.283);ctx.fillStyle=b.color;ctx.fill()}ctx.globalAlpha=1;if(!preview)weapon(b);core(b,preview?18:b.r);if(!preview&&b.shield>0){ctx.beginPath();ctx.arc(b.x,b.y,b.r+12,0,6.283);ctx.strokeStyle='#d7ff9a';ctx.lineWidth=4;ctx.stroke()}if(!preview&&b.freeze>0){ctx.beginPath();ctx.arc(b.x,b.y,b.r+10,0,6.283);ctx.strokeStyle='#b9efff';ctx.lineWidth=4;ctx.stroke()}if(!preview){ctx.beginPath();ctx.arc(b.x,b.y,b.r+7,-1.571,-1.571+6.283*b.hp/100);ctx.strokeStyle=b.hp<30?'#ff5267':'#ffffffd0';ctx.lineWidth=3;ctx.stroke();ctx.textAlign='center';ctx.font='900 11px system-ui';ctx.fillStyle=b.light;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(`${b.name}${S.mode==='2v2'?' · T'+(b.team+1):S.mode==='1v1'?' · 1v1':''}`,b.x,b.y+b.r+18);ctx.font='800 8px system-ui';ctx.fillText(labels[b.ability],b.x,b.y+b.r+29);ctx.shadowBlur=0}}
function arena(){ctx.fillStyle='#080e1a';ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(500,310,20,500,310,520);g.addColorStop(0,'#334c8033');g.addColorStop(1,'#060b1600');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#a8d6ff0b';for(let x=45;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,24);ctx.lineTo(x,H-24);ctx.stroke()}for(let y=45;y<H;y+=45){ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(W-24,y);ctx.stroke()}ctx.strokeStyle='#c0e5ff35';ctx.lineWidth=2;ctx.strokeRect(18,18,W-36,H-36);ctx.fillStyle='#14274766';ctx.fillRect(A.l,A.t,A.r-A.l,A.b-A.t);ctx.save();ctx.shadowColor='#43dfff';ctx.shadowBlur=16;ctx.strokeStyle='#70e8ffb8';ctx.lineWidth=4;ctx.strokeRect(A.l,A.t,A.r-A.l,A.b-A.t);ctx.restore();if(S.playing)hud()}
function health(x,y,b,w){ctx.textAlign='left';ctx.font='900 10px system-ui';ctx.fillStyle=b.out?'#758096':b.light;ctx.fillText(b.name+(b.out?' · OUT':''),x,y);ctx.fillStyle='#ffffff25';ctx.fillRect(x,y+5,w,7);ctx.fillStyle=b.color;ctx.fillRect(x,y+5,w*b.hp/100,7)}
function hud(){if(S.mode==='2v2'){S.balls.filter(b=>b.team===0).forEach((b,i)=>health(30,34+i*24,b,190));S.balls.filter(b=>b.team===1).forEach((b,i)=>health(780,34+i*24,b,190));ctx.textAlign='center';ctx.font='900 12px system-ui';ctx.fillStyle='#e5f7ffcc';ctx.fillText('TEAM BATTLE',500,38)}else if(S.mode==='1v1'){S.balls.forEach((b,i)=>health(i===0?30:780,38,b,190));ctx.textAlign='center';ctx.font='900 12px system-ui';ctx.fillStyle='#e5f7ffcc';ctx.fillText('1 VS 1',500,38)}else S.balls.forEach((b,i)=>health(25+i*240,38,b,190))}
function effects(dt){for(let e of S.fx){e.life-=dt;ctx.save();ctx.globalAlpha=Math.max(0,e.life/e.max);ctx.shadowColor=e.c;ctx.shadowBlur=14;ctx.beginPath();ctx.arc(e.x,e.y,8+e.size*(1-e.life/e.max),0,6.283);ctx.strokeStyle=e.c;ctx.lineWidth=4;ctx.stroke();ctx.restore()}S.fx=S.fx.filter(e=>e.life>0);for(let p of S.bits){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.shadowColor=p.c;ctx.shadowBlur=7;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;S.bits=S.bits.filter(p=>p.life>0)}
function renderRoster(){roster.forEach((f,i)=>{let x=105+i%6*158,y=i<6?195:405,b={...f,x,y,r:18,angle=performance.now()/800+i,hp:100,trail:[],out:false,shield:0,freeze:0};drawBall(b,true);if(f.summoner)for(let k=0;k<3;k++){let a=performance.now()/500+k*2.094;ctx.beginPath();ctx.arc(x+Math.cos(a)*30,y+Math.sin(a)*30,4,0,6.283);ctx.fillStyle='#e1d7ff';ctx.fill()}ctx.textAlign='center';ctx.font='900 10px system-ui';ctx.fillStyle=f.light;ctx.fillText(f.name,x,y+41);ctx.font='700 8px system-ui';ctx.fillStyle='#bed1ea';ctx.fillText(labels[f.ability],x,y+52)})}
function render(dt){ctx.save();if(S.shake>.1&&S.playing){ctx.translate(rand(-S.shake,S.shake),rand(-S.shake,S.shake));S.shake*=.84}arena();if(S.playing){S.balls.forEach(b=>drawBall(b));for(let w of S.wisps){ctx.save();ctx.shadowColor=w.c;ctx.shadowBlur=16;ctx.fillStyle=w.c;ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(w.x,w.y,3,0,6.283);ctx.fill();ctx.restore()}}else renderRoster();effects(dt);ctx.restore()}
function frame(now){let dt=Math.min((now-S.last)/1000||.016,.03);S.last=now;try{update(dt);render(dt)}catch(err){console.error('Game loop recovered from an error:',err);S.playing=false;menu.classList.remove('hidden')}requestAnimationFrame(frame)}
document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>start(button.dataset.mode)));render(0);requestAnimationFrame(frame);
})();
</script></body></html>
